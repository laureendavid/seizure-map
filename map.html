<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Arial", sans-serif;
        background: #f1f5f9;
      }

      /* ── MAP fills full screen ── */
      #map {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }

      /* ── ALERT COUNT BADGE (top-left) ── */
      .alert-badge {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 1000;
        background: #ef4444;
        color: white;
        padding: 7px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        max-width: 55vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── DATE FILTER TOGGLE BUTTON (top-right) ── */
      .date-toggle-btn {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 1001;
        background: white;
        border: none;
        padding: 7px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 4px;
        color: #1e293b;
        max-width: 42vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .date-toggle-btn.has-filter {
        background: #1e293b;
        color: white;
      }

      /* ── BACKDROP (shown when panel is open, tap to close) ── */
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.25);
        z-index: 1002;
        display: none;
      }
      .backdrop.open {
        display: block;
      }

      /* ── DATE FILTER PANEL (dropdown, hidden by default) ── */
      .date-panel {
        position: fixed;
        top: 58px;
        right: 14px;
        left: 14px;
        z-index: 1003;
        background: white;
        padding: 14px;
        border-radius: 16px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
        display: none;
        flex-direction: column;
        gap: 10px;
        max-width: 360px;
        margin-left: auto;
      }
      .date-panel.open {
        display: flex;
      }
      .date-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .date-panel-title {
        font-size: 13px;
        font-weight: bold;
        color: #1e293b;
      }
      .close-panel-btn {
        border: none;
        background: #f1f5f9;
        color: #64748b;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        line-height: 1;
      }

      .quick-range-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .quick-btn {
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #334155;
        padding: 7px 12px;
        border-radius: 14px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .quick-btn.active {
        background: #1e293b;
        color: white;
        border-color: #1e293b;
      }

      .date-range-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .date-range-row .field {
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex: 1;
        min-width: 120px;
      }
      .date-range-row label {
        font-size: 11px;
        color: #64748b;
        font-weight: bold;
      }
      .date-range-row input[type="date"] {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 6px;
        font-size: 12px;
        font-family: inherit;
        width: 100%;
      }
      .clear-dates-btn {
        border: none;
        background: #e2e8f0;
        color: #334155;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        align-self: flex-start;
      }
      .date-summary {
        font-size: 11px;
        color: #64748b;
        border-top: 1px solid #f1f5f9;
        padding-top: 8px;
      }

      /* ── FILTER BUTTONS at the bottom ── */
      .filter-bar {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        gap: 8px;
        background: white;
        padding: 8px 12px;
        border-radius: 30px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        max-width: 94vw;
        overflow-x: auto;
      }
      .filter-btn {
        border: none;
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        opacity: 0.35;
        transition: all 0.2s;
        position: relative;
        white-space: nowrap;
      }
      .filter-btn.active {
        opacity: 1;
        transform: scale(1.05);
      }
      .btn-all {
        background: #1e293b;
        color: white;
      }
      .btn-seizure {
        background: #a855f7;
        color: white;
      }
      .btn-fall {
        background: #f97316;
        color: white;
      }
      .btn-panic {
        background: #ef4444;
        color: white;
      }
      .filter-count {
        font-size: 10px;
        opacity: 0.85;
        margin-left: 3px;
      }

      /* ── LOCATE button ── */
      .locate-btn {
        position: fixed;
        bottom: 76px;
        right: 14px;
        z-index: 1000;
        background: white;
        border: none;
        padding: 9px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      /* ── CONNECTED WEARER INDICATOR ── */
      .wearer-badge {
        position: fixed;
        top: 58px;
        left: 14px;
        z-index: 1000;
        background: white;
        color: #1e293b;
        padding: 6px 12px;
        border-radius: 16px;
        font-size: 11px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        max-width: 55vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: none;
      }
      .wearer-badge.show {
        display: block;
      }
      .wearer-badge.error {
        color: #dc2626;
      }

      /* No results notice */
      .empty-notice {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 999;
        background: white;
        padding: 14px 22px;
        border-radius: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        font-size: 13px;
        color: #64748b;
        font-weight: bold;
        display: none;
        text-align: center;
        max-width: 80vw;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- Alert count -->
    <div class="alert-badge" id="alertBadge">Loading...</div>

    <!-- Connected wearer indicator -->
    <div class="wearer-badge" id="wearerBadge"></div>

    <!-- Date filter toggle button (top-right) -->
    <button class="date-toggle-btn" id="dateToggleBtn" onclick="toggleDatePanel()">
      📅 <span id="dateToggleLabel">All Time</span>
    </button>

    <!-- Backdrop for closing panel on outside tap -->
    <div class="backdrop" id="backdrop" onclick="closeDatePanel()"></div>

    <!-- Date filter panel (hidden until toggled) -->
    <div class="date-panel" id="datePanel">
      <div class="date-panel-header">
        <span class="date-panel-title">Filter by Date</span>
        <button class="close-panel-btn" onclick="closeDatePanel()">✕</button>
      </div>
      <div class="quick-range-row">
        <button class="quick-btn active" data-range="all" onclick="setQuickRange('all')">All Time</button>
        <button class="quick-btn" data-range="today" onclick="setQuickRange('today')">Today</button>
        <button class="quick-btn" data-range="7" onclick="setQuickRange('7')">Last 7 Days</button>
        <button class="quick-btn" data-range="30" onclick="setQuickRange('30')">Last 30 Days</button>
      </div>
      <div class="date-range-row">
        <div class="field">
          <label>From</label>
          <input type="date" id="dateFrom" onchange="onCustomDateChange()" />
        </div>
        <div class="field">
          <label>To</label>
          <input type="date" id="dateTo" onchange="onCustomDateChange()" />
        </div>
      </div>
      <button class="clear-dates-btn" onclick="clearDates()">Clear dates</button>
      <div class="date-summary" id="dateSummary">Showing all dates</div>
    </div>

    <!-- Locate button -->
    <button class="locate-btn" onclick="locateMe()">📍 My Location</button>

    <!-- No results -->
    <div class="empty-notice" id="emptyNotice">No alerts match this filter</div>

    <!-- Filter buttons at bottom -->
    <div class="filter-bar">
      <button class="filter-btn btn-all active" onclick="setTypeFilter('all')">
        All<span class="filter-count" id="count-all"></span>
      </button>
      <button class="filter-btn btn-seizure" onclick="setTypeFilter('seizure')">
        🟣 Seizure<span class="filter-count" id="count-seizure"></span>
      </button>
      <button class="filter-btn btn-fall" onclick="setTypeFilter('fall')">
        🟠 Fall<span class="filter-count" id="count-fall"></span>
      </button>
      <button class="filter-btn btn-panic" onclick="setTypeFilter('panic')">
        🔴 Panic<span class="filter-count" id="count-panic"></span>
      </button>
    </div>

    <script>
      // ── FIREBASE ──────────────────────────────────────────────────────────
      const firebaseConfig = {
        apiKey: "AIzaSyCfhXtIo7JahGIZ2OQ-t_CUs3ou9xMoxsk",
        authDomain: "capstone-2fedw8.firebaseapp.com",
        projectId: "capstone-2fedw8",
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // ── MAP ───────────────────────────────────────────────────────────────
      const map = L.map("map", { zoomControl: true }).setView(
        [14.7948, 120.9252],
        14,
      );
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap",
        maxZoom: 19,
      }).addTo(map);

      const markerCluster = L.markerClusterGroup();
      map.addLayer(markerCluster);

      let allAlerts = [];
      let currentTypeFilter = "all";
      let currentQuickRange = "all";
      let customFrom = null; // Date object, start of day
      let customTo = null; // Date object, end of day
      let hasFittedOnce = false;

      // ── ICON ──────────────────────────────────────────────────────────────
      function getIcon(type) {
        const colors = {
          seizure: "#a855f7",
          fall: "#f97316",
          panic: "#ef4444",
        };
        const color = colors[(type || "").toLowerCase()] || "#6b7280";
        return L.divIcon({
          className: "",
          html: `<div style="
          width:30px; height:30px;
          background:${color};
          border-radius:50% 50% 50% 0;
          transform:rotate(-45deg);
          border:3px solid white;
          box-shadow:0 2px 8px rgba(0,0,0,0.35);
        "></div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 30],
          popupAnchor: [0, -32],
        });
      }

      // ── DATE HELPERS ─────────────────────────────────────────────────────
      function toJsDate(alert) {
        if (!alert.timestamp || !alert.timestamp.seconds) return null;
        return new Date(alert.timestamp.seconds * 1000);
      }

      function startOfDay(d) {
        const x = new Date(d);
        x.setHours(0, 0, 0, 0);
        return x;
      }
      function endOfDay(d) {
        const x = new Date(d);
        x.setHours(23, 59, 59, 999);
        return x;
      }

      function formatDateShort(d) {
        return d.toLocaleDateString("en-PH", {
          timeZone: "Asia/Manila",
          month: "short",
          day: "numeric",
          year: "numeric",
        });
      }

      // Applies the active date range (quick or custom) and returns [from, to] as Date|null
      function getActiveDateRange() {
        if (customFrom || customTo) {
          return [customFrom, customTo];
        }
        const now = new Date();
        if (currentQuickRange === "today") {
          return [startOfDay(now), endOfDay(now)];
        }
        if (currentQuickRange === "7") {
          const from = new Date(now);
          from.setDate(from.getDate() - 6);
          return [startOfDay(from), endOfDay(now)];
        }
        if (currentQuickRange === "30") {
          const from = new Date(now);
          from.setDate(from.getDate() - 29);
          return [startOfDay(from), endOfDay(now)];
        }
        return [null, null]; // all time
      }

      // ── FILTER (type + date combined) ───────────────────────────────────
      function getFilteredAlerts() {
        const [from, to] = getActiveDateRange();

        return allAlerts.filter((a) => {
          // type filter
          if (
            currentTypeFilter !== "all" &&
            (a.type || "").toLowerCase() !== currentTypeFilter
          ) {
            return false;
          }
          // date filter
          if (from || to) {
            const d = toJsDate(a);
            if (!d) return false; // undated alerts excluded when a date range is active
            if (from && d < from) return false;
            if (to && d > to) return false;
          }
          return true;
        });
      }

      // ── RENDER ────────────────────────────────────────────────────────────
      function renderMarkers(fitView) {
        markerCluster.clearLayers();

        const filtered = getFilteredAlerts();

        // Update badge (unacknowledged count within current filter)
        const unack = filtered.filter(
          (a) => a.status === "unacknowledged",
        ).length;
        document.getElementById("alertBadge").textContent =
          unack > 0 ? `🔴 ${unack} Unacknowledged` : `✅ All Acknowledged`;

        // Update per-type counts (respect current date range, ignore type filter itself)
        const [from, to] = getActiveDateRange();
        const dateOnly = allAlerts.filter((a) => {
          if (!from && !to) return true;
          const d = toJsDate(a);
          if (!d) return false;
          if (from && d < from) return false;
          if (to && d > to) return false;
          return true;
        });
        const counts = { all: dateOnly.length, seizure: 0, fall: 0, panic: 0 };
        dateOnly.forEach((a) => {
          const t = (a.type || "").toLowerCase();
          if (counts[t] !== undefined) counts[t]++;
        });
        Object.keys(counts).forEach((k) => {
          const el = document.getElementById("count-" + k);
          if (el) el.textContent = ` (${counts[k]})`;
        });

        // Sort by most recent first for popup consistency (not strictly required for markers)
        filtered.sort((a, b) => {
          const da = toJsDate(a);
          const db = toJsDate(b);
          if (!da || !db) return 0;
          return db - da;
        });

        filtered.forEach(function (a) {
          if (!a.latitude || !a.longitude) return;

          const marker = L.marker([a.latitude, a.longitude], {
            icon: getIcon(a.type),
          });

          const isUnack = a.status === "unacknowledged";
          const d = toJsDate(a);
          const dateStr = d ? formatDateShort(d) : "N/A";
          const timeStr = d
            ? d.toLocaleTimeString("en-PH", {
                timeZone: "Asia/Manila",
                hour: "2-digit",
                minute: "2-digit",
              })
            : "";

          marker.bindPopup(`
          <div style="font-family:Arial; font-size:14px; line-height:2; min-width:200px;">
            <b style="font-size:15px;">${a.title || "Alert"}</b><br>
            <span>📌 Type: <b>${(a.type || "").toUpperCase()}</b></span><br>
            <span>👤 Wearer: ${a.wearerId || "Unknown"}</span><br>
            <span>📅 ${dateStr} &nbsp; 🕐 ${timeStr}</span><br><br>
            <span style="
              display:inline-block;
              background:${isUnack ? "#fee2e2" : "#dcfce7"};
              color:${isUnack ? "#dc2626" : "#16a34a"};
              padding:3px 10px; border-radius:12px;
              font-size:12px; font-weight:bold;
            ">${isUnack ? "🔴 Needs Attention" : "✅ Acknowledged"}</span>
          </div>
        `);

          markerCluster.addLayer(marker);
        });

        // Empty state
        document.getElementById("emptyNotice").style.display =
          filtered.length === 0 ? "block" : "none";

        // Only auto-fit bounds on first load or when the user actively changes a filter,
        // not on every realtime Firestore update (so the map doesn't jump around).
        if (fitView && markerCluster.getLayers().length > 0) {
          map.fitBounds(markerCluster.getBounds(), { padding: [70, 90] });
        }
      }

      // ── DATE SUMMARY TEXT ────────────────────────────────────────────────
      function updateDateSummary() {
        const [from, to] = getActiveDateRange();
        const summaryEl = document.getElementById("dateSummary");
        const toggleLabel = document.getElementById("dateToggleLabel");
        const toggleBtn = document.getElementById("dateToggleBtn");

        let text = "Showing all dates";
        let short = "All Time";
        if (from && to) {
          text = `Showing ${formatDateShort(from)} – ${formatDateShort(to)}`;
          short = `${formatDateShort(from)} – ${formatDateShort(to)}`;
        } else if (from) {
          text = `Showing from ${formatDateShort(from)}`;
          short = `From ${formatDateShort(from)}`;
        } else if (to) {
          text = `Showing up to ${formatDateShort(to)}`;
          short = `Up to ${formatDateShort(to)}`;
        }

        summaryEl.textContent = text;
        toggleLabel.textContent = short;
        toggleBtn.classList.toggle("has-filter", !(!from && !to));
      }

      // ── PANEL OPEN/CLOSE ─────────────────────────────────────────────────
      function toggleDatePanel() {
        const panel = document.getElementById("datePanel");
        if (panel.classList.contains("open")) {
          closeDatePanel();
        } else {
          openDatePanel();
        }
      }
      function openDatePanel() {
        document.getElementById("datePanel").classList.add("open");
        document.getElementById("backdrop").classList.add("open");
      }
      function closeDatePanel() {
        document.getElementById("datePanel").classList.remove("open");
        document.getElementById("backdrop").classList.remove("open");
      }

      // ── TYPE FILTER ───────────────────────────────────────────────────────
      function setTypeFilter(type) {
        currentTypeFilter = type;
        document
          .querySelectorAll(".filter-btn")
          .forEach((b) => b.classList.remove("active"));
        const map2 = {
          all: "btn-all",
          seizure: "btn-seizure",
          fall: "btn-fall",
          panic: "btn-panic",
        };
        document.querySelector("." + map2[type]).classList.add("active");
        renderMarkers(true);
      }

      // ── QUICK DATE RANGE ─────────────────────────────────────────────────
      function setQuickRange(range) {
        currentQuickRange = range;
        customFrom = null;
        customTo = null;
        document.getElementById("dateFrom").value = "";
        document.getElementById("dateTo").value = "";
        document
          .querySelectorAll(".quick-btn")
          .forEach((b) => b.classList.remove("active"));
        document.querySelector(`[data-range="${range}"]`).classList.add("active");
        updateDateSummary();
        renderMarkers(true);
      }

      // ── CUSTOM DATE RANGE ────────────────────────────────────────────────
      function onCustomDateChange() {
        const fromVal = document.getElementById("dateFrom").value;
        const toVal = document.getElementById("dateTo").value;
        customFrom = fromVal ? startOfDay(new Date(fromVal + "T00:00:00")) : null;
        customTo = toVal ? endOfDay(new Date(toVal + "T00:00:00")) : null;

        // deactivate quick-range buttons since a custom range is now driving the filter
        document
          .querySelectorAll(".quick-btn")
          .forEach((b) => b.classList.remove("active"));
        if (!fromVal && !toVal) {
          currentQuickRange = "all";
          document.querySelector('[data-range="all"]').classList.add("active");
        }

        updateDateSummary();
        renderMarkers(true);
      }

      function clearDates() {
        document.getElementById("dateFrom").value = "";
        document.getElementById("dateTo").value = "";
        setQuickRange("all");
      }

      // ── URL PARAM HELPER ─────────────────────────────────────────────────
      function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      // ── WEARER BADGE ─────────────────────────────────────────────────────
      function setWearerBadge(text, isError) {
        const el = document.getElementById("wearerBadge");
        el.textContent = text;
        el.classList.add("show");
        el.classList.toggle("error", !!isError);
      }

      // ── FIRESTORE: listen to alerts, filtered by wearerId(s) when available ──
      let alertsUnsubscribe = null;

      function listenToAlerts(wearerIds) {
        if (alertsUnsubscribe) {
          alertsUnsubscribe(); // stop any previous listener before starting a new one
        }
        let query = db.collection("alerts");
        if (wearerIds) {
          const idList = Array.isArray(wearerIds) ? wearerIds : [wearerIds];
          if (idList.length === 1) {
            query = query.where("wearerId", "==", idList[0]);
          } else if (idList.length > 1) {
            query = query.where("wearerId", "in", idList.slice(0, 10)); // Firestore 'in' supports max 10
          }
        }
        alertsUnsubscribe = query.onSnapshot(
          function (snapshot) {
            allAlerts = [];
            snapshot.forEach((doc) => allAlerts.push(doc.data()));
            // Fit the map view only the very first time data loads, so incoming
            // realtime alerts afterwards don't yank the map away from the user.
            renderMarkers(!hasFittedOnce);
            hasFittedOnce = true;
          },
          function (error) {
            console.error("Alerts listener error:", error);
            setWearerBadge("⚠️ Could not load alerts", true);
          },
        );
      }

      // ── RESOLVE LOGGED-IN CAREGIVER → CONNECTED WEARER(S) ────────────────
      // Schema:
      //   caregiver_connections: { caregiverUid, wearerId, status } — status must be "accepted"
      //   wearers: { wearerId, wearerName } — used only for a friendly display name
      async function initAlertsForCurrentUser() {
        const uid = getQueryParam("uid");

        if (!uid) {
          // No uid passed in the URL (e.g. testing directly in a browser) —
          // fall back to showing every alert, unfiltered.
          listenToAlerts(null);
          return;
        }

        try {
          const connectionsSnap = await db
            .collection("caregiver_connections")
            .where("caregiverUid", "==", uid)
            .where("status", "==", "accepted")
            .get();

          if (connectionsSnap.empty) {
            setWearerBadge("⚠️ No accepted wearer connection found", true);
            listenToAlerts(null);
            return;
          }

          const wearerIds = [
            ...new Set(
              connectionsSnap.docs
                .map((d) => d.data().wearerId)
                .filter(Boolean),
            ),
          ];

          if (wearerIds.length === 0) {
            setWearerBadge("⚠️ No wearer linked to this account", true);
            listenToAlerts(null);
            return;
          }

          // Look up friendly wearer name(s) for the badge (falls back to raw id if not found)
          let displayNames = wearerIds;
          try {
            const wearersSnap = await db
              .collection("wearers")
              .where("wearerId", "in", wearerIds.slice(0, 10)) // Firestore 'in' supports max 10
              .get();
            const nameMap = {};
            wearersSnap.forEach((doc) => {
              const w = doc.data();
              nameMap[w.wearerId] = w.wearerName || w.wearerId;
            });
            displayNames = wearerIds.map((id) => nameMap[id] || id);
          } catch (lookupErr) {
            console.warn("Could not look up wearer names:", lookupErr);
          }

          setWearerBadge(`👤 Connected: ${displayNames.join(", ")}`, false);
          listenToAlerts(wearerIds);
        } catch (err) {
          console.error("Failed to resolve caregiver → wearer:", err);
          setWearerBadge("⚠️ Error loading connection", true);
          listenToAlerts(null);
        }
      }

      initAlertsForCurrentUser();
      updateDateSummary();

      // ── LOCATE ────────────────────────────────────────────────────────────
      function locateMe() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(function (pos) {
            map.setView([pos.coords.latitude, pos.coords.longitude], 16);
            L.circleMarker([pos.coords.latitude, pos.coords.longitude], {
              radius: 10,
              color: "#3b82f6",
              fillColor: "#3b82f6",
              fillOpacity: 0.8,
            })
              .addTo(map)
              .bindPopup("<b>You are here</b>")
              .openPopup();
          });
        }
      }
    </script>
  </body>
</html>
